<!DOCTYPE html>
<html lang="en">
<head>
  <title>Personal Library</title>
  <link rel="icon" type="image/png" href="https://cdn.freecodecamp.org/universal/favicons/favicon-16x16.png" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <header>
    <h1>📚 Personal Library</h1>
  </header>

  <div class="container">
    <!-- Sample Front-End Section -->
    <section id="sampleui">
      <div class="section-header">
        <h2>My Library</h2>
        <p class="subtitle">Manage your personal book collection</p>
      </div>

      <div class="border">
        <form id="newBookForm">
          <label for="bookTitleToAdd">📖 Add a New Book</label>
          <input 
            type="text" 
            id="bookTitleToAdd" 
            name="title" 
            placeholder="Enter book title (e.g., Moby Dick)"
            required
          >
          <button type="submit" id="newBook">Add Book</button>
        </form>
      </div>

      <div class="border">
        <h4>Your Books</h4>
        <div id='display'></div>
      </div>

      <div class="border" id='bookDetail'>
        <h4>Book Details</h4>
        <p id='detailTitle'>👈 Select a book to see its details and comments</p>
        <ol id='detailComments'></ol>
      </div>

      <button id='deleteAllBooks' class="danger">🗑️ Delete All Books</button>
    </section>

    <hr>

    <!-- API Testing Section -->
    <section id="sampleposting">
      <div class="section-header">
        <h2>API Testing</h2>
        <p class="subtitle">Test the API endpoints directly</p>
      </div>

      <div class="border">
        <h4>POST /api/books</h4>
        <form action="/api/books" method="post">
          <label for="title">Book Title</label>
          <input type="text" id="title" name="title" placeholder="Enter title">
          <input type="submit" value="Submit">
        </form>
      </div>

      <div class="border">
        <h4>POST /api/books/{bookid}</h4>
        <form action="" method="post" id="commentTest">
          <label for="idinputtest">Book ID</label>
          <input type="text" name="id" placeholder="Enter book ID" id="idinputtest">
          <label for="comment">Comment</label>
          <input type="text" id="comment" name="comment" placeholder="Enter comment">
          <input type="submit" value="Submit">
        </form>
      </div>
    </section>
  </div>

  <script src="https://code.jquery.com/jquery-2.2.1.min.js"
          integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
          crossorigin="anonymous"></script>
  <script src="/public/client.js"></script>
  <script>
    $(function() {
      $('#commentTest').submit(function(){
        let id = $('#idinputtest').val();
        if (id) {
          $(this).attr('action', "/api/books/" + id);
        }
      });
    });
  </script>
</body>
</html>
